<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panou administrator | Limba și Literatura Română</title>
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

  
<body>

    <div id="site"></div>
     <!-- =====================================================
     CONSTRUCTOR QUIZ ADMIN
====================================================== -->

<section class="admin-section" id="adminQuiz">

    <h2>🎮 Constructor Quiz</h2>

    <!-- =========================
         CREARE QUIZ
    ========================== -->

    <div class="quiz-admin-card">

        <h3>🌲 Creează un quiz nou</h3>

        <label for="quizTitlu">
            Titlul quizului
        </label>

        <input
            type="text"
            id="quizTitlu"
            placeholder="Ex: Aventuri prin pădure"
        >

        <label for="quizCategorie">
            Categoria
        </label>

        <input
            type="text"
            id="quizCategorie"
            placeholder="Ex: Limba română"
        >

        <label for="quizDescriere">
            Descriere
        </label>

        <textarea
            id="quizDescriere"
            rows="4"
            placeholder="Descrierea quizului..."
        ></textarea>

        <button
            class="admin-btn"
            type="button"
            onclick="creeazaQuiz()">

            🎮 Creează quizul

        </button>

        <div
            id="quizCreareStatus"
            class="admin-status">
        </div>

    </div>


    <!-- =========================
         QUIZ SELECTAT
    ========================== -->

    <div
        class="quiz-admin-card"
        id="quizEditor"
        style="display:none;">

        <h3>
            ✏️ Editează quizul
        </h3>

        <div id="quizEditorTitlu"></div>


        <!-- =========================
             ADAUGĂ ÎNTREBARE
        ========================== -->

        <h3>
            ❓ Adaugă întrebare
        </h3>

        <label for="quizIntrebare">
            Întrebarea
        </label>

        <textarea
            id="quizIntrebare"
            rows="3"
            placeholder="Scrie întrebarea..."
        ></textarea>


        <label for="quizRaspunsA">
            A
        </label>

        <input
            type="text"
            id="quizRaspunsA"
            placeholder="Varianta A"
        >


        <label for="quizRaspunsB">
            B
        </label>

        <input
            type="text"
            id="quizRaspunsB"
            placeholder="Varianta B"
        >


        <label for="quizRaspunsC">
            C
        </label>

        <input
            type="text"
            id="quizRaspunsC"
            placeholder="Varianta C"
        >


        <label for="quizRaspunsD">
            D
        </label>

        <input
            type="text"
            id="quizRaspunsD"
            placeholder="Varianta D"
        >


        <label for="quizRaspunsCorect">
            Răspuns corect
        </label>

        <select id="quizRaspunsCorect">

            <option value="">
                Selectează răspunsul
            </option>

            <option value="A">
                A
            </option>

            <option value="B">
                B
            </option>

            <option value="C">
                C
            </option>

            <option value="D">
                D
            </option>

        </select>


        <!-- =========================
             ANIMAL
        ========================== -->

        <label for="quizAnimal">
            Animalul întâlnit
        </label>

        <select id="quizAnimal">

            <option value="lup">
                🐺 Lup
            </option>

            <option value="vulpe">
                🦊 Vulpe
            </option>

            <option value="urs">
                🐻 Urs
            </option>

            <option value="cerb">
                🦌 Cerb
            </option>

            <option value="iepure">
                🐰 Iepure
            </option>

            <option value="mistret">
                🐗 Mistreț
            </option>

            <option value="bufnita">
                🦉 Bufniță
            </option>

        </select>


        <label for="quizImagineAnimal">
            Imagine animal
        </label>

        <input
            type="file"
            id="quizImagineAnimal"
            accept="image/*"
        >


        <label for="quizOrdine">
            Ordinea întrebării
        </label>

        <input
            type="number"
            id="quizOrdine"
            min="1"
            value="1"
        >


        <button
            class="admin-btn"
            type="button"
            onclick="adaugaIntrebareQuiz()">

            ➕ Adaugă întrebarea

        </button>


        <div
            id="intrebareQuizStatus"
            class="admin-status">
        </div>

    </div>


    <!-- =========================
         LISTA QUIZURI
    ========================== -->

    <div class="quiz-admin-card">

        <h3>
            📚 Quizurile mele
        </h3>

        <div id="listaQuizuriAdmin">
            <p>Se încarcă...</p>
        </div>

    </div>


    <!-- =========================
         LISTA ÎNTREBĂRILOR
    ========================== -->

    <div class="quiz-admin-card">

        <h3>
            ❓ Întrebările quizului
        </h3>

        <div id="listaIntrebariQuizAdmin">
            <p>
                Selectează un quiz.
            </p>
        </div>

    </div>
    </section>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/init.js"></script>
<script src="js/site.js"></script>
<script src="js/admin.js"></script>


    

</body>

   </html>
